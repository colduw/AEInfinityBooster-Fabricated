plugins {
    id 'fabric-loom' version '1.10.5'
}

group = 'uk.co.hexeption'
version = 'fabric-1.20.1-1.0.0'

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

base {
    archivesName = 'AEInfinityBooster'
}

loom {
    runs {
        client { client() }
        server { server() }
        datagen {
            inherit getByName("server")

            vmArg("-Dfabric-api.datagen")
            vmArg("-Dfabric-api.datagen.output-dir=${file('src/generated/resources/')}")
            vmArg("-Dfabric-api.datagen.modid=aeinfinitybooster")
        }
    }

    mixin {
        defaultRefmapName = "AEInfinityBooster.refmap.json"
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
    maven {
        url = "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
}

dependencies {
    minecraft 'net.minecraft:minecraft:1.20.1'
    mappings loom.officialMojangMappings()

    modImplementation "net.fabricmc:fabric-loader:0.19.5"
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.92.12+1.20.1"

    // appliedenergistics2-fabric-15.4.11.jar
    modImplementation "curse.maven:applied-energistics-2-223794:8991393"

    // jei-1.20.1-fabric-15.12.2.51.jar
    modRuntimeOnly "curse.maven:jei-238222:5626487"
}

jar {
    manifest {
        attributes([
                "Specification-Title"     : "aeinfinitybooster",
                //"Specification-Vendor"  : "aeinfinitybooster authors",
                "Specification-Version"   : "1", // We are version 1 of ourselves
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.jar.archiveVersion,
                //"Implementation-Vendor" : "aeinfinitybooster authors",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
        ])
    }
}